name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes no macOS
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Verificar dependências
        run: |
          python -m pip check
          python -m pip_audit -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Executar autoteste
        run: python hollyoptimizer_gui.py --self-test

      - name: Validar fontes
        run: |
          python -m compileall -q core hollyoptimizer.py hollyoptimizer_gui.py
          node --check gui/app.js
